<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Departments')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4"><h2 class="fw-bold mb-1">Departments</h2><p class="text-muted mb-4">Organize employees by department</p><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
<div class="row g-4"><div class="col-lg-5"><form th:action="@{/departments}" th:object="${department}" method="post" class="card border-0 shadow-sm"><div class="card-body"><h5 class="mb-3">Add department</h5><label class="form-label">Department name</label><input class="form-control mb-3" th:field="*{name}" placeholder="e.g. Operations" required><button class="btn btn-primary">Add department</button></div></form></div>
<div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table mb-0 align-middle"><thead><tr><th>#</th><th>Department</th><th>Action</th></tr></thead><tbody><tr th:each="d : ${departments}"><td th:text="${d.id}"></td><td th:text="${d.name}"></td><td><form th:action="@{/departments/{id}/delete(id=${d.id})}" method="post" onsubmit="return confirm('Delete this department? Employees will become unassigned.')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table></div></div></div></div></main></body></html>
