<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Employees')}"></head><body><div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container py-4"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h2 class="fw-bold mb-1">Employees</h2><p class="text-muted mb-0">Manage your employee directory</p></div><a class="btn btn-primary" href="/employees/new">+ Add employee</a></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
<form class="row g-2 mb-3" method="get"><div class="col-sm-6 col-md-4"><input class="form-control" name="q" th:value="${q}" placeholder="Search name, email or job title"></div><div class="col-auto"><button class="btn btn-outline-primary">Search</button><a class="btn btn-outline-secondary" href="/employees">Clear</a></div></form>
<div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Employee</th><th>Email</th><th>Job title</th><th>Department</th><th>Salary</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr th:each="e : ${employees}"><td class="fw-semibold" th:text="${e.fullName}"></td><td th:text="${e.email}"></td><td th:text="${e.jobTitle}"></td><td th:text="${e.department != null ? e.department.name : '—'}"></td><td th:text="${#numbers.formatDecimal(e.salary,1,2)}"></td><td><span class="badge text-bg-success" th:if="${e.status == 'ACTIVE'}">Active</span><span class="badge text-bg-secondary" th:unless="${e.status == 'ACTIVE'}">Inactive</span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/employees/{id}/edit(id=${e.id})}">Edit</a> <form class="d-inline" th:action="@{/employees/{id}/delete(id=${e.id})}" method="post" onsubmit="return confirm('Delete this employee?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>
<tr th:if="${#lists.isEmpty(employees)}"><td colspan="7" class="text-center text-muted py-4">No employees found.</td></tr></tbody></table></div></div></main></body></html>
