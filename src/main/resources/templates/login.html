<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | PeopleDesk</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head>
<body class="login-bg"><div class="card login-card shadow-lg"><div class="card-body p-5">
<h2 class="fw-bold mb-1">PeopleDesk</h2><p class="text-muted mb-4">Employee Management System</p>
<div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div><div th:if="${param.logout}" class="alert alert-success">You have signed out.</div>
<form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autofocus></div>
<div class="mb-4"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-primary w-100">Sign in</button></form><p class="small text-muted mt-4 mb-0">Demo: admin / Admin@123</p>
</div></div></body></html>
